[package]
name = "rust-ingestor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] } # Asynchronous runtime
notify = "6.1.1" # Watches the folder for changes
pdf-extract = "0.7.2" # Extracts text from PDFs
walkdir = "2.4" # Recursively looks through folders
reqwest = { version = "0.11", features = ["json"] } # To send data to the Python service
serde = { version = "1.0", features = ["derive"] } # For data handling
serde_json = "1.0"
docx-rs = "0.3"
uuid = { version = "1.0", features = ["v4"] }