<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra-RAG Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        /* Layout Grid */
        .app-container { display: flex; flex-grow: 1; gap: 20px; overflow: hidden; margin-top: 10px; }
        
        /* Sidebar Styles */
        .sidebar { width: 260px; background-color: #1e1e1e; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .new-chat-btn { width: 100%; margin-bottom: 20px; background-color: #27ae60; }
        .new-chat-btn:hover { background-color: #219653; }
        .session-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .session-item { padding: 12px; background: #2d2d2d; border-radius: 6px; cursor: pointer; color: #ccc; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; transition: 0.2s; }
        .session-item:hover { background: #3d3d3d; }
        .session-item.active { border-color: #4a90e2; background-color: #2b5c8f; color: white; }
        
        /* Main Chat Area Styles */
        .main-chat { flex-grow: 1; display: flex; flex-direction: column; }
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 20px; background-color: #1e1e1e; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; }
        .user-message { background-color: #2b5c8f; margin-left: auto; color: #fff; }
        .ai-message { background-color: #2d2d2d; margin-right: auto; color: #ddd; border: 1px solid #444; }
        
        /* Input Area Styles */
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 15px; border-radius: 8px; border: 1px solid #444; background-color: #1e1e1e; color: white; font-size: 16px; }
        button { padding: 15px 30px; border: none; border-radius: 8px; background-color: #4a90e2; color: white; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #357abd; }
        .typing { color: #888; font-style: italic; font-size: 14px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <h2 style="margin-top: 0; margin-bottom: 10px; color: #4a90e2;">🐉 Hydra-RAG Console</h2>
    
    <div class="app-container">
        <!-- Sidebar for History -->
        <div class="sidebar">
            <button onclick="startNewChat()" class="new-chat-btn">➕ New Chat</button>
            <div style="font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase;">Recent Chats</div>
            <div class="session-list" id="session-list">
                <!-- Session items will populate here -->
            </div>
        </div>

        <!-- Main Chat Window -->
        <div class="main-chat">
            <div id="chat-container">
                <div class="message ai-message">System online. Engine connected to Llama 3. Local data indexed. What would you like to search?</div>
            </div>
            
            <div class="typing" id="typing-indicator">Hydra is processing local vectors...</div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Ask about your documents..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Generate an initial session ID
        let currentSessionId = crypto.randomUUID();

        // Load previous sessions when the page loads
        window.onload = loadSessionList;

        // Fetch the list of all session IDs from the Go backend
        async function loadSessionList() {
            try {
                const response = await fetch('/sessions');
                const data = await response.json();
                
                const list = document.getElementById('session-list');
                list.innerHTML = ''; // Clear current list
                
                if (data.sessions) {
                    data.sessions.reverse().forEach(id => {
                        const isActive = id === currentSessionId ? 'active' : '';
                        list.innerHTML += `
                            <div class="session-item ${isActive}" onclick="loadOldChat('${id}')" id="session-${id}">
                                💬 Chat (${id.substring(0, 5)})
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.error("Failed to load sessions:", err);
            }
        }

        // Start a brand new chat
        function startNewChat() {
            currentSessionId = crypto.randomUUID();
            const chat = document.getElementById('chat-container');
            
            // Reset chat window
            chat.innerHTML = `<div class="message ai-message">System online. Engine connected to Llama 3. Local data indexed. What would you like to search?</div>`;
            
            // Remove active highlight from sidebar
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
        }

        // Load a specific old chat by ID
        async function loadOldChat(sessionId) {
            currentSessionId = sessionId;
            const chat = document.getElementById('chat-container');
            
            // Update sidebar highlighting
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            const activeTab = document.getElementById(`session-${sessionId}`);
            if (activeTab) activeTab.classList.add('active');

            try {
                const response = await fetch(`/sessions/${sessionId}`);
                const data = await response.json();
                
                if (data.messages) {
                    chat.innerHTML = ''; // Clear screen
                    data.messages.forEach(msg => {
                        const msgClass = msg.role === 'user' ? 'user-message' : 'ai-message';
                        chat.innerHTML += `<div class="message ${msgClass}">${msg.content}</div>`;
                    });
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (err) {
                console.error("Failed to load old chat:", err);
            }
        }

        // Send a message to the backend
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-container');
            const typing = document.getElementById('typing-indicator');
            const query = input.value.trim();
            
            if (!query) return;

            // Add User Message
            chat.innerHTML += `<div class="message user-message">${query}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
            typing.style.display = 'block';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        query: query,
                        session_id: currentSessionId // Included session tracking
                    })
                });
                
                const data = await response.json();
                
                // Add AI Message
                typing.style.display = 'none';
                if (data.answer) {
                    chat.innerHTML += `<div class="message ai-message">${data.answer}</div>`;
                } else {
                    chat.innerHTML += `<div class="message ai-message" style="color: #ff5555;">Error: ${data.error}</div>`;
                }
                chat.scrollTop = chat.scrollHeight;

                // Refresh the sidebar list so the new chat shows up immediately
                loadSessionList();

            } catch (err) {
                typing.style.display = 'none';
                chat.innerHTML += `<div class="message ai-message" style="color: #ff5555;">Critical Error: Could not reach Go Gateway.</div>`;
            }
        }
    </script>
</body>
</html>
