services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hydra-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - hydra-net

  inference:
    build: ./python-inference
    container_name: hydra-inference
    ports:
      - "8000:8000"
    networks:
      - hydra-net

  gateway:
    build: ./go-gateway
    container_name: hydra-gateway
    ports:
      - "3000:3000"
    environment:
      - INFERENCE_URL=http://inference:8000
      - QDRANT_URL=http://qdrant:6333
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=https://api.groq.com/openai/v1/chat/completions
      - LLM_MODEL=llama-3.1-8b-instant
    depends_on:
      - inference
      - qdrant
    networks:
      - hydra-net

  ingestor:
    build: ./rust-ingestor
    container_name: hydra-ingestor
    volumes:
      - ./data:/data
    environment:
      - INFERENCE_URL=http://inference:8000
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - inference
      - qdrant
    networks:
      - hydra-net

networks:
  hydra-net:
    driver: bridge